<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#1e1e2d">
  <title>تسجيل الدخول | Nexo</title>
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
  <style>
    :root { --primary:#4361ee; --dark:#1e1e2d; --danger:#f1416c; }
    *{margin:0;padding:0;box-sizing:border-box;font-family:'Tajawal',Tahoma,sans-serif}
    body{min-height:100dvh;display:flex;align-items:center;justify-content:center;padding:20px;
         background:radial-gradient(1200px 600px at 80% -10%, #2b2b40 0%, #1e1e2d 55%, #16161f 100%);}
    .login-card{width:100%;max-width:420px;background:#fff;border-radius:18px;padding:38px 32px;
                box-shadow:0 24px 60px rgba(0,0,0,.35);animation:rise .45s ease}
    @keyframes rise{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
    .brand{text-align:center;margin-bottom:28px}
    .brand-logo{width:64px;height:64px;border-radius:18px;background:var(--dark);color:var(--primary);
                display:flex;align-items:center;justify-content:center;font-size:30px;margin:0 auto 14px}
    .brand h1{font-size:26px;color:var(--dark);letter-spacing:1px}
    .brand p{font-size:12px;color:#8a8fa3;margin-top:6px}
    .field{margin-bottom:16px}
    .field label{display:block;font-size:13px;font-weight:700;color:#3f4254;margin-bottom:7px}
    .input-wrap{position:relative}
    .input-wrap i{position:absolute;inset-inline-start:14px;top:50%;transform:translateY(-50%);color:#b5b9c9;font-size:14px}
    .field input{width:100%;padding:13px 42px 13px 14px;border:1.5px solid #e4e6ef;border-radius:10px;font-size:15px;transition:.2s;background:#fafbfd}
    .field input:focus{outline:none;border-color:var(--primary);background:#fff;box-shadow:0 0 0 4px rgba(67,97,238,.12)}
    .toggle-eye{position:absolute;inset-inline-end:12px;top:50%;transform:translateY(-50%);border:0;background:none;color:#b5b9c9;cursor:pointer;font-size:14px}
    .login-btn{width:100%;padding:13px;border:0;border-radius:10px;background:var(--primary);color:#fff;
               font-size:16px;font-weight:700;cursor:pointer;transition:.2s;margin-top:8px}
    .login-btn:hover{background:#3550d8}
    .login-btn:disabled{opacity:.6;cursor:not-allowed}
    .msg{margin-top:16px;padding:11px 14px;border-radius:9px;font-size:13.5px;font-weight:500;display:none;line-height:1.7}
    .msg.error{display:block;background:#fff0f4;color:var(--danger);border:1px solid #ffd6e2}
    .msg.info{display:block;background:#eef2ff;color:#3550d8;border:1px solid #dbe2ff}
    .foot{text-align:center;margin-top:24px;font-size:11.5px;color:#a1a5b7}
  </style>
</head>
<body>

  <div class="login-card">
    <div class="brand">
      <div class="brand-logo"><i class="fas fa-bolt"></i></div>
      <h1>Nexo</h1>
      <p>نظام متكامل لإدارة الصفحات والتواصل</p>
    </div>

    <form id="loginForm" novalidate>
      <div class="field">
        <label for="email">البريد الإلكتروني</label>
        <div class="input-wrap">
          <i class="fas fa-envelope"></i>
          <input type="email" id="email" autocomplete="username" placeholder="name@company.com" required>
        </div>
      </div>

      <div class="field">
        <label for="password">كلمة المرور</label>
        <div class="input-wrap">
          <i class="fas fa-lock"></i>
          <input type="password" id="password" autocomplete="current-password" placeholder="••••••••" required>
          <button type="button" class="toggle-eye" id="toggleEye" aria-label="إظهار كلمة المرور"><i class="fas fa-eye"></i></button>
        </div>
      </div>

      <button type="submit" class="login-btn" id="loginBtn">تسجيل الدخول</button>
      <div id="msg" class="msg"></div>
    </form>

    <div class="foot">الحسابات بيتم إنشاؤها بواسطة إدارة النظام فقط</div>
  </div>

  <script type="module">
    import { auth, signInWithEmailAndPassword, onAuthStateChanged } from "./js/firebase.js";

    const form = document.getElementById("loginForm");
    const btn  = document.getElementById("loginBtn");
    const msg  = document.getElementById("msg");
    const emailEl = document.getElementById("email");
    const passEl  = document.getElementById("password");

    if (new URLSearchParams(location.search).has("blocked")) {
      show("الحساب ده غير مفعّل أو غير مسجّل في النظام. كلّم إدارة النظام.", "error");
    }

    // لو مسجل دخول بالفعل → ادخل على طول
    onAuthStateChanged(auth, (user) => { if (user) location.replace("index.html"); });

    document.getElementById("toggleEye").addEventListener("click", () => {
      const isPwd = passEl.type === "password";
      passEl.type = isPwd ? "text" : "password";
      document.getElementById("toggleEye").innerHTML = `<i class="fas fa-eye${isPwd ? "-slash" : ""}"></i>`;
    });

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      const email = emailEl.value.trim();
      const password = passEl.value;
      msg.className = "msg";

      if (!email || !password) return show("اكتب البريد الإلكتروني وكلمة المرور.", "error");

      btn.disabled = true;
      btn.textContent = "جاري التحقق...";
      try {
        await signInWithEmailAndPassword(auth, email, password);
        show("تم الدخول بنجاح، جاري فتح لوحة التحكم...", "info");
        location.replace("index.html");
      } catch (err) {
        show(errorText(err.code), "error");
        btn.disabled = false;
        btn.textContent = "تسجيل الدخول";
      }
    });

    function show(text, type) { msg.textContent = text; msg.className = `msg ${type}`; }

    function errorText(code) {
      switch (code) {
        case "auth/invalid-email":       return "صيغة البريد الإلكتروني غير صحيحة.";
        case "auth/user-disabled":       return "الحساب ده متوقف. كلّم إدارة النظام.";
        case "auth/too-many-requests":   return "محاولات كتير جداً. استنى شوية وحاول تاني.";
        case "auth/network-request-failed": return "مفيش اتصال بالإنترنت.";
        case "auth/user-not-found":
        case "auth/wrong-password":
        case "auth/invalid-credential":  return "البريد الإلكتروني أو كلمة المرور غير صحيحة.";
        default: return "تعذّر تسجيل الدخول. حاول تاني.";
      }
    }
  </script>
</body>
</html>
