name: Deploy to Firebase

# بيشتغل أوتوماتيك مع أي تعديل على الفرع main.
# يعني تقدر تعدّل الكود من موقع GitHub من الموبايل، والنظام يتحدّث لوحده.
on:
  push:
    branches: [main]
  workflow_dispatch:      # وكمان تقدر تشغّله بإيدك من تاب Actions

# لو اتعمل push تاني والرفع لسه شغّال، بنلغي القديم ونكمّل بالجديد
concurrency:
  group: deploy-firebase
  cancel-in-progress: true

permissions:
  contents: write         # عشان يقدر يرجّع رقم الإصدار للريبو

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: تثبيت أدوات Firebase
        run: npm install -g firebase-tools@14

      - name: تثبيت مكتبات السيرفر
        working-directory: functions
        run: npm ci || npm install

      # مفتاح الخدمة بيتكتب في ملف مؤقت، وfirebase بيقراه من المتغير ده.
      # الملف بيتمسح في آخر خطوة مهما حصل.
      - name: تجهيز صلاحيات الدخول
        env:
          SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          if [ -z "$SA" ]; then
            echo "::error::سر FIREBASE_SERVICE_ACCOUNT مش متظبط في إعدادات الريبو."
            echo "::error::روح Settings ثم Secrets and variables ثم Actions وضيفه."
            exit 1
          fi
          printf '%s' "$SA" > "$RUNNER_TEMP/sa.json"
          echo "GOOGLE_APPLICATION_CREDENTIALS=$RUNNER_TEMP/sa.json" >> "$GITHUB_ENV"

      # الصفحات + الدوال + قواعد الفايرستور والفهارس.
      # الملف القديم كان بيرفع الصفحات بس، فتعديل أي دالة سيرفر
      # مكانش بينزل خالص.
      # كل جزء لوحده: لو مفتاح الخدمة ناقصه صلاحية على جزء معيّن،
      # الباقي ينزل عادي بدل ما الرفعة كلها تقع. الخلاصة في الآخر
      # بتقول بالظبط إيه اللي نزل وإيه اللي لأ وإيه الحل.
      - name: رفع الصفحات
        id: hosting
        continue-on-error: true
        run: firebase deploy --project nexo-crm-28376 --only hosting --non-interactive --force

      - name: رفع الدوال
        id: functions
        continue-on-error: true
        run: firebase deploy --project nexo-crm-28376 --only functions --non-interactive --force

      - name: رفع قواعد وفهارس قاعدة البيانات
        id: firestore
        continue-on-error: true
        run: firebase deploy --project nexo-crm-28376 --only firestore --non-interactive --force

      - name: رفع قواعد التخزين
        id: storage
        continue-on-error: true
        run: firebase deploy --project nexo-crm-28376 --only storage --non-interactive --force

      # رقم البناء بيزيد مع كل رفعة (scripts/version.js). لازم يرجع
      # للريبو، وإلا الرفعة الجاية هتحسب من رقم قديم وتكرره.
      # [skip ci] بتمنع إن الكوميت ده يشغّل رفعة جديدة ونفضل في لفة.
      - name: حفظ رقم الإصدار الجديد
        if: steps.hosting.outcome == 'success'
        run: |
          if git diff --quiet -- version.json; then
            echo "رقم الإصدار ما اتغيرش"
            exit 0
          fi
          VER=$(node -p "require('./version.json').full")
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add version.json
          git commit -m "رفع تلقائي: الإصدار $VER [skip ci]"
          git push

      - name: تنظيف مفتاح الخدمة
        if: always()
        run: rm -f "$RUNNER_TEMP/sa.json"

      - name: الخلاصة
        if: always()
        run: |
          VER=$(node -p "require('./version.json').full" 2>/dev/null || echo "غير معروف")
          mark() { [ "$1" = "success" ] && echo "✅ نزل" || echo "❌ فشل"; }
          {
            echo "### نتيجة الرفع"
            echo ""
            echo "| الجزء | الحالة |"
            echo "|---|---|"
            echo "| الصفحات (الواجهة) | $(mark '${{ steps.hosting.outcome }}') |"
            echo "| الدوال (السيرفر) | $(mark '${{ steps.functions.outcome }}') |"
            echo "| قواعد وفهارس قاعدة البيانات | $(mark '${{ steps.firestore.outcome }}') |"
            echo "| قواعد التخزين | $(mark '${{ steps.storage.outcome }}') |"
            echo ""
            echo "- **الإصدار:** $VER"
            echo "- **الرابط:** https://nexo-crm-28376.web.app"
            echo ""
            if [ "${{ steps.hosting.outcome }}${{ steps.functions.outcome }}${{ steps.firestore.outcome }}${{ steps.storage.outcome }}" != "successsuccesssuccesssuccess" ]; then
              echo "> ⚠️ **في جزء ما نزلش** — مفتاح الخدمة ناقصه صلاحيات."
              echo ">"
              echo "> **الحل مرة واحدة:** افتح [صفحة الصلاحيات](https://console.cloud.google.com/iam-admin/iam?project=nexo-crm-28376)،"
              echo "> دوّر على الحساب اللي بيبدأ بـ \`firebase-adminsdk\`، اضغط القلم، وضيف الأدوار دي:"
              echo ">"
              echo "> - **Firebase Admin**"
              echo "> - **Cloud Functions Admin**"
              echo "> - **Service Account User**"
              echo "> - **Artifact Registry Writer**"
            else
              echo "> ✅ كل حاجة نزلت."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      # الرفعة تُعتبر فاشلة لو أي جزء وقع — عشان مايعديش من غير ما ناخد بالنا
      - name: التحقق النهائي
        if: always()
        run: |
          FAILED=""
          [ "${{ steps.hosting.outcome }}"   != "success" ] && FAILED="$FAILED الصفحات"
          [ "${{ steps.functions.outcome }}" != "success" ] && FAILED="$FAILED الدوال"
          [ "${{ steps.firestore.outcome }}" != "success" ] && FAILED="$FAILED قاعدة-البيانات"
          [ "${{ steps.storage.outcome }}"   != "success" ] && FAILED="$FAILED التخزين"
          if [ -n "$FAILED" ]; then
            echo "::error::الأجزاء دي ما نزلتش:$FAILED — شوف الخلاصة فوق للحل."
            exit 1
          fi
          echo "كل الأجزاء نزلت بنجاح"
