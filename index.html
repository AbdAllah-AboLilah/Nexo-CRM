<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#1e1e2d">
  <title>Nexo | لوحة التحكم</title>

  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icon.svg">

  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="booting">

  <!-- شاشة التحميل الأولى -->
  <div id="bootScreen" class="boot-screen">
    <div class="boot-logo"><i class="fas fa-bolt"></i></div>
    <div class="boot-name">Nexo</div>
    <div class="spin"></div>
  </div>

  <div class="scrim" id="scrim"></div>

  <!-- القائمة الجانبية -->
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-header">
      <div class="logo-title"><i class="fas fa-bolt"></i><span>Nexo</span></div>
      <div class="logo-subtitle">نظام متكامل لإدارة الصفحات والتواصل</div>
    </div>
    <ul class="nav-links" id="navLinks"></ul>
    <div class="sidebar-footer">
      الإصدار الحالي: <strong id="appVersion">—</strong>
    </div>
  </aside>

  <!-- المحتوى -->
  <div class="main-content">
    <header class="topbar">
      <div class="topbar-start">
        <button class="icon-btn menu-toggle" id="menuToggle" aria-label="القائمة"><i class="fas fa-bars"></i></button>
        <h2 id="pageTitle">الرئيسية</h2>
        <div class="tenant-chip" id="tenantChip"></div>
      </div>

      <div class="topbar-end">
        <div class="system-indicators">
          <i class="fas fa-desktop device-icon" id="desktopIcon" title="وضع الكمبيوتر"></i>
          <i class="fas fa-mobile-screen device-icon" id="mobileIcon" title="وضع الموبايل"></i>
          <span class="divider"></span>
          <div class="network-status">
            <span class="status-dot dot-green" id="networkDot"></span>
            <span class="net-text" id="networkText">متصل</span>
          </div>
        </div>

        <div class="user-wrap">
          <div class="user-profile" id="userProfile">
            <div class="user-avatar" id="userAvatar">N</div>
            <div class="user-info">
              <h4 id="userName">—</h4>
              <span id="userRole">—</span>
            </div>
            <i class="fas fa-chevron-down caret"></i>
          </div>
          <div class="user-menu" id="userMenu">
            <button id="btnAbout"><i class="fas fa-circle-info"></i> عن النظام</button>
            <button id="btnLogout" class="danger"><i class="fas fa-right-from-bracket"></i> تسجيل الخروج</button>
          </div>
        </div>
      </div>
    </header>

    <main class="content-area" id="screen"></main>
  </div>

  <!-- مكتبة قراءة ملفات الإكسيل (تُستخدم في شاشة المخزون) -->
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js" defer></script>
  <script type="module" src="js/app.js"></script>
  <script>
    if ("serviceWorker" in navigator) {
      window.addEventListener("load", () => navigator.serviceWorker.register("sw.js").catch(() => {}));
    }
  </script>
</body>
</html>
